name: Check Broken Links

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/content/blog/**'
      - 'apps/web/src/app/**'
      - 'apps/web/scripts/check-broken-links.cjs'
  pull_request:
    paths:
      - 'apps/web/content/blog/**'
      - 'apps/web/src/app/**'
      - 'apps/web/scripts/check-broken-links.cjs'

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for broken links
        working-directory: apps/web
        run: node scripts/check-broken-links.cjs --strict

      - name: Check internal links added to existing posts
        working-directory: apps/web
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STRICT_INTERNAL_LINKS: ${{ startsWith(github.head_ref || github.ref_name, 'internal-links/') || contains(github.event.head_commit.message, '[internal-links]') }}
        run: node scripts/check-new-internal-links.cjs --content content/blog --url '/blog/{stem}'
