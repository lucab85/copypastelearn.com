name: OG / Social Card Check

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  og-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Open Graph / link preview
        uses: lucab85/site-og-check@main
        with:
          url: https://copypastelearn.com/